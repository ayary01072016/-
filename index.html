<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7E8">
<title>Мой день 🌈</title>
<style>
:root{
  --bg:#fff8ec; --card:#fff; --text:#34323a; --muted:#8c8992;
  --accent:#7c6ce5; --accent2:#ff9d6c; --green:#6fbd8b;
  --shadow:0 8px 24px rgba(70,55,30,.08);
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#fff8ec 0%,#f8f4ff 100%);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)}
.app{width:min(100%,560px);margin:auto;padding:18px 15px 34px}
.hero{background:linear-gradient(135deg,#8d7bea,#b19cf6);color:white;border-radius:28px;padding:23px 21px;
box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"🌈";position:absolute;right:13px;bottom:-8px;font-size:70px;opacity:.35}
.hello{font-size:14px;opacity:.9;margin-bottom:5px}.title{font-size:30px;font-weight:800;letter-spacing:-.6px}
.date{margin-top:7px;font-size:14px;opacity:.9}
.progress{margin-top:18px;background:rgba(255,255,255,.28);height:10px;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:white;border-radius:99px;transition:.3s}
.progressText{font-size:12px;margin-top:7px;opacity:.9}
.section{display:flex;justify-content:space-between;align-items:center;margin:22px 3px 10px}
.section h2{font-size:19px;margin:0}.reset{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px}
.item{background:var(--card);border-radius:20px;margin:10px 0;padding:14px;display:flex;gap:12px;align-items:center;
box-shadow:var(--shadow);transition:.2s}
.item.done{opacity:.58}.item.done .name{text-decoration:line-through}
.time{min-width:58px;font-weight:800;color:var(--accent);font-size:14px}
.icon{width:43px;height:43px;border-radius:14px;background:#f3efff;display:grid;place-items:center;font-size:23px;flex:none}
.info{flex:1;min-width:0}.name{font-weight:750;font-size:15px}.hint{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.3}
.check{width:30px;height:30px;border-radius:50%;border:2px solid #d9d5df;background:white;display:grid;place-items:center;
font-size:16px;flex:none;cursor:pointer}.done .check{background:var(--green);border-color:var(--green);color:white}
.card{background:white;border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-top:14px}
.card h3{margin:0 0 8px;font-size:16px}.tip{font-size:13px;line-height:1.45;color:#68656d}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
.edit{margin-top:10px;width:100%;padding:13px;border:0;border-radius:15px;background:#f0ecff;color:#6557c7;font-weight:750;font-size:14px}
.modal{display:none;position:fixed;inset:0;background:rgba(35,30,45,.38);padding:16px;z-index:5}
.modal.show{display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:26px 26px 16px 16px;padding:20px;width:min(100%,560px);max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 14px}.row{display:grid;grid-template-columns:72px 44px 1fr;gap:8px;margin:8px 0}
input{width:100%;border:1px solid #e3dfe8;border-radius:12px;padding:10px;font:inherit}
.close{width:100%;margin-top:12px;padding:13px;border:0;border-radius:15px;background:var(--accent);color:white;font-weight:800}
@media(min-width:600px){.app{padding-top:28px}.hero{padding:27px 25px}}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="hello">Доброе утро! ☀️</div>
    <div class="title">Мой день</div>
    <div class="date" id="today"></div>
    <div class="progress"><i id="bar"></i></div>
    <div class="progressText" id="progressText">0 из 12 выполнено</div>
  </header>

  <div class="section"><h2>Мой будний день 🌸</h2><button class="reset" onclick="resetDay()">Сначала</button></div>
  <main id="list"></main>

  <div class="card">
    <h3>💛 Маленькое напоминание</h3>
    <div class="tip">Не обязательно делать всё идеально. Главное — двигаться по шагам. Ты справишься! 🌟</div>
    <button class="edit" onclick="openEdit()">✏️ Настроить мой распорядок</button>
  </div>
  <div class="footer">Мой день • только для меня 🌈</div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h2>Настроить распорядок ✨</h2>
    <div id="editor"></div>
    <button class="close" onclick="saveEdit()">Сохранить</button>
  </div>
</div>

<script>
const defaultItems=[
["06:00","🌞","Проснуться","Доброе утро! Начинаем день"],
["06:10","🛏️","Заправить кровать","Порядок начинается с маленького шага"],
["06:15","🪥","Умыться и почистить зубы","Свежесть и чистота"],
["06:30","🥣","Завтрак","Спокойно позавтракать"],
["06:40","🎒","Собраться в школу","Проверить рюкзак и всё необходимое"],
["06:50","🚪","Выйти из дома","Хорошего дня! 🌷"],
["08:00–15:00","🏫","Школа","Учиться, общаться и узнавать новое"],
["15:30–19:00","🎨","Отдых, свободное время и ужин","Отдохнуть, поиграть и поужинать"],
["19:00","📚","Домашнее задание","Сначала самое важное"],
["21:00","🧸","Вечерний порядок","Убрать вещи и подготовиться к завтрашнему дню"],
["22:00","🌙","Подготовка ко сну","Душ, зубы, спокойные дела перед сном"],
["22:30","😴","Сон","Добрых снов! 💜"]
];
let items=JSON.parse(localStorage.getItem("myDayItems")||"null")||defaultItems;
let done=JSON.parse(localStorage.getItem("myDayDone")||"[]");

function render(){
 const list=document.getElementById("list");
 list.innerHTML=items.map((x,i)=>`
 <div class="item ${done.includes(i)?"done":""}">
   <div class="time">${x[0]}</div><div class="icon">${x[1]}</div>
   <div class="info"><div class="name">${x[2]}</div><div class="hint">${x[3]}</div></div>
   <button class="check" aria-label="Готово" onclick="toggle(${i})">${done.includes(i)?"✓":""}</button>
 </div>`).join("");
 updateProgress();
}
function toggle(i){
 done=done.includes(i)?done.filter(x=>x!==i):[...done,i];
 localStorage.setItem("myDayDone",JSON.stringify(done)); render();
}
function updateProgress(){
 const n=items.length, d=done.filter(i=>i<n).length;
 document.getElementById("bar").style.width=(d/n*100)+"%";
 document.getElementById("progressText").textContent=`${d} из ${n} выполнено`;
}
function resetDay(){
 if(confirm("Начать день заново?")){done=[];localStorage.setItem("myDayDone","[]");render()}
}
function openEdit(){
 document.getElementById("editor").innerHTML=items.map((x,i)=>`
 <div class="row">
   <input data-i="${i}" data-k="0" value="${x[0]}" aria-label="Время">
   <input data-i="${i}" data-k="1" value="${x[1]}" aria-label="Иконка">
   <input data-i="${i}" data-k="2" value="${x[2]}" aria-label="Название">
 </div>`).join("");
 document.getElementById("modal").classList.add("show");
}
function saveEdit(){
 document.querySelectorAll("#editor input").forEach(el=>items[+el.dataset.i][+el.dataset.k]=el.value);
 localStorage.setItem("myDayItems",JSON.stringify(items));
 done=done.filter(i=>i<items.length); localStorage.setItem("myDayDone",JSON.stringify(done));
 document.getElementById("modal").classList.remove("show");render();
}
const d=new Date();
document.getElementById("today").textContent=d.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});
render();
</script>
</body>
</html>
